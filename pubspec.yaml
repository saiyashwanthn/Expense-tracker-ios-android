name: expense_tracker
description: A comprehensive expense tracking app with manual entry, categories, analytics, and daily reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Notifications
  flutter_local_notifications: ^16.3.0
  
  # Date & Time
  intl: ^0.18.1
  
  # Charts
  fl_chart: ^0.65.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # Path Provider
  path_provider: ^2.1.1
  
  # Shared Preferences
  shared_preferences: ^2.2.2
  
  # Timezone
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

